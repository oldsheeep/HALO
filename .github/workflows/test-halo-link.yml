name: Test halo-link

# halo-link のホストでのテスト(模擬バス、サニタイザ有効)。
on:
  pull_request:
    paths:
      - "halo-link/**"
      - ".github/workflows/test-halo-link.yml"
  push:
    branches: [develop, main]
    paths:
      - "halo-link/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash halo-link/scripts/test.sh
