# ステージされたファイル(= 差分)だけに実行される。
# auto fix するフックはファイルを書き換えてコミットを一度失敗させる。
# 書き換え後の内容を `git add` して、もう一度コミットする。
#
# PR の CI では warn 扱いにするフック(markdownlint, shellcheck)がある。
# 変更する場合は .github/workflows/lint-format.yml の WARN_HOOKS も合わせる。
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  # Python(MicroPython など)。linter の auto fix と formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # C / C++ の formatter(スタイルは .clang-format)
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c, c++]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint
        args: [--fix]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
